name: Daily Newsletter

on:
  schedule:
    # 2 AM Bogota (UTC-5) = 7 AM UTC, Monday through Saturday
    - cron: '0 7 * * 1-6'
  workflow_dispatch:  # Allow manual trigger

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily newsletter pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        run: python -m src.main --tier tier1

      - name: Commit state and newsletter archive
        run: |
          git config user.name "Surfing the AI Wave Bot"
          git config user.email "bot@surfing-ai-wave.local"
          git add state.json newsletters/ || true
          git diff --cached --quiet || git commit -m "Daily newsletter $(date +%Y-%m-%d)"
          git push || true

      - name: Cleanup old raw data
        run: |
          find data/raw -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          find data/analyzed -maxdepth 1 -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
